welcome.body: "本工具適用於没有 U 碟、但網路條件較好的電腦：\n在線下載 jftw Go 資源，解壓安裝到你指定的目錄，並可直接啟動。\n\n使用前提：\n  • 可正常访問資源站點的網路；\n  • 一個可寫的安裝目錄（建議非系統碟）。\n\n注意：本程式需要聯網下載資源，不做 U 碟製作。\n若你要製作可攜带的 U 碟啟動碟，請使用 jftw Go Installer。"
